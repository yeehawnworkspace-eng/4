<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Di Hằn 🎂</title>
<style>
  :root{
    --pw: clamp(150px, 40vw, 300px);
    --ink: #7a2c4d;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(180deg,#fdeef4 0%, #fbe0ec 55%, #f8d3e4 100%);
    color: var(--ink);
    overflow-x: hidden;
    min-height: 100%;
  }
  .scene{
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 9vh 16px 5vh;
  }
  .title-note{
    font-size: 13px;
    letter-spacing:.04em;
    color: #b5678a;
    margin-bottom: 22px;
    opacity: .85;
    text-align:center;
  }
  .book-wrap{
    perspective: 2400px;
    display:flex;
    justify-content:center;
    width:100%;
  }
  .book{
    position: relative;
    width: var(--pw);
    height: calc(var(--pw) / 0.7075);
    transition: width .95s cubic-bezier(.65,.05,.36,1), height .95s cubic-bezier(.65,.05,.36,1);
  }
  .book.open{
    width: min(calc(var(--pw) * 2), 92vw);
  }
  .book::after{
    content:'';
    position:absolute; left:50%; top:2%; bottom:2%; width:18px; margin-left:-9px;
    background:linear-gradient(90deg, rgba(70,10,30,.18), rgba(70,10,30,0) 45%, rgba(70,10,30,0) 55%, rgba(70,10,30,.18));
    opacity:0; transition: opacity .7s ease .2s; pointer-events:none; z-index:4; border-radius: 4px;
  }
  .book.open::after{ opacity:1; }

  .page{
    position:absolute; top:0; bottom:0; width:50%; height:100%;
    overflow:hidden;
    box-shadow: 0 10px 26px rgba(120,30,65,.28);
  }
  .page.left-page{ left:0; border-radius: 16px 4px 4px 16px; background:#fce3ee; }
  .page.right-page{ right:0; border-radius: 4px 16px 16px 4px; background:#fce3ee; }

  .cover{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:6; cursor:pointer;
    transform-origin: 0% 50%;
    transition: transform 1s cubic-bezier(.65,.05,.36,1), box-shadow .3s;
    backface-visibility: hidden;
    border-radius: 16px;
    overflow:hidden;
    box-shadow: 0 14px 34px rgba(120,25,60,.4);
  }
  .book.open .cover{ transform: rotateY(-150deg); pointer-events:none; box-shadow:none; }
  .cover img{ width:100%; height:100%; display:block; object-fit:cover; }
  .cover .hint{
    position:absolute; left:0; right:0; bottom:14px;
    text-align:center; font-size: clamp(11px,3vw,13px); color:#fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
    letter-spacing:.05em;
    animation: pulse 1.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{ 0%,100%{opacity:.65;} 50%{opacity:1;} }

  /* ---------- LEFT PAGE : envelope + letter ---------- */
  .left-page-inner{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding: 9%;
  }
  .envelope-stage{
    position:relative; width:100%; cursor:pointer;
    transition: transform .2s ease;
  }
  .envelope-stage:active{ transform: scale(.97); }
  .envelope-img{
    width:100%; display:block; border-radius:10px;
    transform: rotate(-1.4deg);
    box-shadow: 0 10px 22px rgba(120,20,55,.35);
  }
  .env-hint{
    position:absolute; left:0; right:0; bottom:-26px;
    text-align:center; font-size: clamp(11px,2.6vw,12.5px);
    color:#b5678a; transition: opacity .3s;
  }

  .letter-el{
    position:absolute; inset: 9%;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform: scale(.35) translate(18%, 14%);
    transform-origin: 62% 68%;
    transition: opacity .45s ease, transform .5s cubic-bezier(.34,1.45,.6,1);
    pointer-events:none;
    z-index:3;
    cursor:pointer;
  }
  .letter-el.shown{
    opacity:1; transform: scale(1) translate(0,0);
    pointer-events:auto;
  }
  .letter-el img{
    width:100%; display:block; border-radius:8px;
    transform: rotate(1deg);
    box-shadow: 0 14px 34px rgba(110,15,50,.45);
  }

  /* ---------- RIGHT PAGE : candles ---------- */
  .candle-stage{
    position:relative; width:100%; height:100%; overflow:hidden;
  }
  .cake-img{ width:100%; height:100%; display:block; object-fit:cover; }

  .flame{ position:absolute; will-change: transform; }
  .flame img{
    width:100%; height:100%; display:block;
    transform-origin: 50% 90%;
    filter: drop-shadow(0 0 7px rgba(255,185,60,.65));
  }
  .flame.out img{
    transition: opacity .5s ease, transform .5s ease;
    opacity:0; transform: scale(.25) translateY(10%);
  }
  .smoke{
    position:absolute; width:220%; height:220%; left:-60%; top:-160%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(180,180,180,.55), rgba(180,180,180,0) 70%);
    opacity:0; pointer-events:none;
  }
  .flame.out .smoke{ animation: smoke-rise 1.2s ease-out forwards; }
  @keyframes smoke-rise{
    0%{ opacity:.55; transform: translateY(0) scale(.6); }
    100%{ opacity:0; transform: translateY(-60%) scale(1.3); }
  }

  .level-meter{
    position:absolute; left:8%; top:5%; width:34px; height:110px;
    background: rgba(255,255,255,.55);
    border: 2px solid rgba(180,60,100,.35);
    border-radius: 18px;
    overflow:hidden;
    display:flex; align-items:flex-end; justify-content:center;
    backdrop-filter: blur(2px);
    z-index:5;
  }
  .level-fill{
    width:100%; height:4%;
    background: linear-gradient(180deg,#ff9ec7,#ff5f9e);
    transition: height .05s linear;
  }
  .level-icon{
    position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    font-size:16px;
  }

  .mic-status{
    position:absolute; left:6%; right:6%; bottom:4%;
    font-size: clamp(9.5px, 2.3vw, 11px);
    text-align:center; color:#8a4265;
    background: rgba(255,255,255,.55);
    border-radius: 10px; padding: 5px 6px;
    line-height:1.35;
    z-index:5;
  }

  .wish-message{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding: 10%;
    background: rgba(255,240,246,.55);
    backdrop-filter: blur(1px);
    opacity:0; pointer-events:none;
    transition: opacity .6s ease;
    z-index:7;
  }
  .wish-message.shown{ opacity:1; pointer-events:auto; }
  .wish-text{
    font-size: clamp(15px, 4.4vw, 20px);
    font-weight:700;
    color:#a3305c;
    text-shadow: 0 2px 8px rgba(255,255,255,.8);
  }
  #relightBtn{
    padding: 9px 18px; border:none; border-radius:24px;
    background:#ff6f9c; color:#fff; font-weight:600; font-size: clamp(12px,3vw,14px);
    cursor:pointer; box-shadow: 0 6px 16px rgba(255,90,140,.45);
  }
  #relightBtn:active{ transform: scale(.96); }

  .confetti-piece{
    position:absolute; top:-10px; width:7px; height:13px; opacity:.95;
    animation: confetti-fall 2.3s ease-in forwards; border-radius:2px; z-index:8;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(340px) translateX(calc(var(--drift) * 70px)) rotate(680deg); opacity:0; }
  }

  .blow-controls{
    position:absolute; left:6%; right:6%; top:5%;
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
    z-index:5;
  }
  #holdBlowBtn{
    padding: 9px 14px; border:none; border-radius:22px;
    background: rgba(255,255,255,.85); color:#a3305c; font-weight:700;
    font-size: clamp(11px,2.8vw,13px);
    box-shadow: 0 6px 14px rgba(120,30,65,.28);
    cursor:pointer; user-select:none;
  }
  #holdBlowBtn:active, #holdBlowBtn.active{ background:#ff9ec7; color:#fff; transform: scale(.97); }

  .back-btn{
    margin-top: 30px;
    padding: 10px 24px; border:none; border-radius:30px;
    background:#fff5f8; color:#b5335c; font-weight:600; font-size:14px;
    box-shadow: 0 6px 16px rgba(120,30,60,.22);
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition: opacity .4s ease;
  }
  .scene.is-open .back-btn{ opacity:1; pointer-events:auto; }

  @media (max-width: 380px){
    .level-meter{ width:28px; height:90px; left:6%; }
    .blow-controls{ top:4%; }
  }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="title-note">✨ a little scrapbook, just for you ✨</div>

    <div class="book-wrap">
      <div class="book" id="book">

        <div class="page left-page">
          <div class="left-page-inner">
            <div class="envelope-stage" id="envelopeStage">
              <img class="envelope-img" src="COVER_ENVELOPE" alt="envelope">
              <div class="env-hint" id="envHint">tap the envelope 💌</div>
            </div>
            <div class="letter-el" id="letterEl">
              <img src="COVER_LETTER" alt="letter">
            </div>
          </div>
        </div>

        <div class="page right-page">
          <div class="candle-stage" id="candleStage">
            <img class="cake-img" src="COVER_CAKE" alt="cake">

            <div class="flame" id="flame1" style="left:39.3%; top:39.7%; width:4.6%; height:5.1%;">
              <div class="smoke"></div>
              <img src="COVER_F1" alt="">
            </div>
            <div class="flame" id="flame2" style="left:44.1%; top:46.7%; width:5.6%; height:5.1%;">
              <div class="smoke"></div>
              <img src="COVER_F2" alt="">
            </div>
            <div class="flame" id="flame3" style="left:54.7%; top:44.7%; width:4.3%; height:5.1%;">
              <div class="smoke"></div>
              <img src="COVER_F3" alt="">
            </div>

            <div class="level-meter" id="levelMeter">
              <div class="level-icon">🎤</div>
              <div class="level-fill" id="levelFill"></div>
            </div>

            <div class="blow-controls">
              <button id="holdBlowBtn">hold to blow 💨</button>
            </div>

            <div class="mic-status" id="micStatus">turning on the mic…</div>

            <div class="wish-message" id="wishMsg">
              <div class="wish-text">make a wish, <span id="wishName">Di Hằn</span>! 🌸</div>
              <button id="relightBtn">relight candles 🔥</button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <button class="back-btn" id="backBtn">↩ back to cover</button>
  </div>

<script>
(function(){
  const scene = document.getElementById('scene');
  const book = document.getElementById('book');
  const backBtn = document.getElementById('backBtn');
  const envelopeStage = document.getElementById('envelopeStage');
  const letterEl = document.getElementById('letterEl');
  const envHint = document.getElementById('envHint');

  // ---------- open / close book ----------
  function openBook(){
    if(book.classList.contains('open')) return;
    book.classList.add('open');
    scene.classList.add('is-open');
    initMic();
  }
  function closeBook(){
    book.classList.remove('open');
    scene.classList.remove('is-open');
    letterEl.classList.remove('shown');
    envHint.style.opacity = '1';
  }
  book.addEventListener('click', function(e){
    if(!book.classList.contains('open')) openBook();
  });
  backBtn.addEventListener('click', function(e){
    e.stopPropagation();
    closeBook();
  });

  // ---------- envelope / letter ----------
  envelopeStage.addEventListener('click', function(e){
    e.stopPropagation();
    letterEl.classList.add('shown');
    envHint.style.opacity = '0';
  });
  letterEl.addEventListener('click', function(e){
    e.stopPropagation();
    letterEl.classList.remove('shown');
    envHint.style.opacity = '1';
  });

  // ---------- candles / mic blow ----------
  const flames = [document.getElementById('flame1'), document.getElementById('flame2'), document.getElementById('flame3')];
  const levelFill = document.getElementById('levelFill');
  const micStatus = document.getElementById('micStatus');
  const wishMsg = document.getElementById('wishMsg');
  const relightBtn = document.getElementById('relightBtn');
  const holdBlowBtn = document.getElementById('holdBlowBtn');
  const candleStage = document.getElementById('candleStage');

  const insecure = (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1');

  let audioCtx = null, analyser = null, dataArray = null, micActive = false, micAttempted = false;
  let manualBlow = false;
  let smoothedLevel = 0;
  let blowTimer = 0;
  let extinguished = false;
  let lastTime = performance.now();
  const phase = [Math.random()*10, Math.random()*10, Math.random()*10];

  const THRESHOLD = 0.32;
  const SUSTAIN_NEEDED = 0.5; // seconds
  const RMS_GAIN = 4.2;

  function setMicStatus(text){ micStatus.textContent = text; }

  function initMic(){
    if(micAttempted) return;
    micAttempted = true;

    if(insecure){
      setMicStatus('mic needs this page to be hosted over https (won\u2019t work opened as a local file) \u2014 the hold-to-blow button below always works! \ud83d\udca8');
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setMicStatus('this browser can\u2019t access the mic here \u2014 use the hold-to-blow button below! \ud83d\udca8');
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.2;
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.fftSize);
        micActive = true;
        setMicStatus('mic is on \u2014 blow gently toward your device! \ud83c\udf2c\ufe0f');
      })
      .catch(function(err){
        setMicStatus('mic blocked or unavailable \u2014 no worries, use the hold-to-blow button below! \ud83d\udca8');
      });
  }

  function getMicLevel(){
    if(!micActive || !analyser) return 0;
    analyser.getByteTimeDomainData(dataArray);
    let sumSq = 0;
    for(let i=0;i<dataArray.length;i++){
      const v = (dataArray[i]-128)/128;
      sumSq += v*v;
    }
    const rms = Math.sqrt(sumSq/dataArray.length);
    return Math.min(1, rms*RMS_GAIN);
  }

  // hold-to-blow fallback (mouse / touch)
  function pressStart(e){ e.preventDefault(); manualBlow = true; holdBlowBtn.classList.add('active'); }
  function pressEnd(e){ manualBlow = false; holdBlowBtn.classList.remove('active'); }
  holdBlowBtn.addEventListener('mousedown', pressStart);
  holdBlowBtn.addEventListener('touchstart', pressStart, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(evt){
    holdBlowBtn.addEventListener(evt, pressEnd);
  });

  // spacebar fallback
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && book.classList.contains('open') && !extinguished){
      manualBlow = true;
      holdBlowBtn.classList.add('active');
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space'){
      manualBlow = false;
      holdBlowBtn.classList.remove('active');
    }
  });

  function extinguishCandles(){
    extinguished = true;
    flames.forEach(function(f){ f.classList.add('out'); });
    setTimeout(function(){
      wishMsg.classList.add('shown');
      launchConfetti();
    }, 480);
  }

  function relight(){
    extinguished = false;
    blowTimer = 0;
    wishMsg.classList.remove('shown');
    flames.forEach(function(f){ f.classList.remove('out'); });
  }
  relightBtn.addEventListener('click', function(e){ e.stopPropagation(); relight(); });

  function launchConfetti(){
    const colors = ['#ff8fab','#ffd166','#8ecae6','#b8f2e6','#f6c6ea','#ffb4a2'];
    for(let i=0;i<30;i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (Math.random()*100)+'%';
      el.style.background = colors[i % colors.length];
      el.style.animationDelay = (Math.random()*0.35)+'s';
      el.style.setProperty('--drift', (Math.random()*2-1).toFixed(2));
      candleStage.appendChild(el);
      setTimeout(function(){ el.remove(); }, 2800);
    }
  }

  function tick(now){
    const dt = Math.min(0.05, (now-lastTime)/1000);
    lastTime = now;

    const micLevel = getMicLevel();
    const rawLevel = manualBlow ? 1 : micLevel;
    smoothedLevel = smoothedLevel*0.72 + rawLevel*0.28;

    levelFill.style.height = (Math.max(4, smoothedLevel*100)) + '%';

    if(!extinguished){
      const blowing = smoothedLevel > THRESHOLD;
      if(blowing){ blowTimer += dt; }
      else { blowTimer = Math.max(0, blowTimer - dt*2.2); }

      const t = now/1000;
      flames.forEach(function(f, i){
        const idle = Math.sin(t*3.2 + phase[i]) * 4;
        const bendDir = (i % 2 === 0) ? 1 : -1;
        const bend = smoothedLevel * 42 * bendDir + Math.sin(t*14 + phase[i]) * smoothedLevel * 8;
        const scaleY = 1 - smoothedLevel*0.18 + Math.sin(t*10+phase[i])*0.02;
        const img = f.querySelector('img');
        img.style.transform = 'rotate(' + (idle + bend) + 'deg) scaleY(' + scaleY + ')';
      });

      if(blowTimer >= SUSTAIN_NEEDED){
        extinguishCandles();
      }
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
